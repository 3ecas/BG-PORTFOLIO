  <!-- Your content. Loaded first so the theme is set before the page paints. -->
  <script src="content.js"></script>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('bg-theme'); } catch (e) {}
      var d = (window.PORTFOLIO && window.PORTFOLIO.site && window.PORTFOLIO.site.theme) || 'dark';
      t = t || d;
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="assets/js/main.js" defer></script>
